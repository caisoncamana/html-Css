<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>

    <style>
        div.container{
            background-color: blue;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: aqua;
            border: 1px solid black;
            flex-basis: 150px;
            
        }

        div#i1{
            
            flex: 1 0 150px;
        }
        div#i2{
    
            flex: 1 0 150px;
            
        }

        div#i3{
            flex: 1 0 150px;
            
        }



    </style>
</head>
<body>
    <h1>Primeiros flexbox (flex basis, flex-grow e flex-shrink)</h1>
    <div class="container">
        <div class="item" id="i1">1</div>
        <div class="item" id="i2">2</div>
        <div class="item" id="i3">3</div>
    </div>
    
</body>
</html>
