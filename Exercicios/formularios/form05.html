<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formularios</title>
</head>
<body>
    <form action="" method="get">
        
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas">
            <label for="isxmas">Masculino</label>

            <input type="radio" name="sexo" id="isxfem">
            <label for="isxfem">Femenino</label>

        </fieldset>

        <fieldset>
            <legend>Esport favorito</legend>
            <input type="checkbox" name="fut" id="ifut">
            <label for="ifut">Futebol</label><br>
            
            <input type="checkbox" name="andebool" id="iandebool">
            <label for="iandebool">Andebool</label><br>

            <input type="checkbox" name="judo" id="iJudo">
            <label for="iJudo">Judô</label><br>

            <input type="checkbox" name="tenis" id="itenis">
            <label for="itenis">Tenis</label><br>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
