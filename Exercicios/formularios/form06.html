<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formularios</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>

    <form action="" method="post">
        <p>
            <label for="icor">Cor</label>
            <input type="color" name="color" id="icor">
        </p>
        
        <p>
            <label for="inivel">Nivel de Satisfação</label>
            <input type="range" name="range" id="inivel">
        </p>

        <p>
            <label for="ifoto">Foto do Perfil</label>
            <input type="file" name="foto" id="ifoto">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
